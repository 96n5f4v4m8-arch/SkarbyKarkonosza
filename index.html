        let punktyTrasy = [];

        function uruchomGre() {
            nazwaPatrolu = document.getElementById('team-name').value;
            const wybranyKluczTrasy = document.getElementById('route-select').value;
            const wybranaNazwaTrasy = document.getElementById('route-select').options[document.getElementById('route-select').selectedIndex].text;

            if (!nazwaPatrolu) return alert("Musisz podać nazwę patrolu!");

            punktyTrasy = bazaTras[wybranyKluczTrasy];

            document.getElementById('stat-team').innerText = "Patrol: " + nazwaPatrolu;
            document.getElementById('stat-route').innerText = "Trasa: " + wybranaNazwaTrasy;
            document.getElementById('stat-total').innerText = punktyTrasy.length;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            InicjalizujMape();
        }

        function InicjalizujMape() {
            // Centrujemy na 1. punkcie wybranej trasy, zoom oddalony do 13, by widzieć więcej punktów górskich
            mapa = L.map('map').setView([punktyTrasy[0].lat, punktyTrasy[0].lng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(mapa);

            punktyTrasy.forEach(p => {
                p.marker = L.marker([p.lat, p.lng]).addTo(mapa).bindPopup(p.nazwa);
            });

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(aktualizujPozycjeGracza, bladGPS, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            } else {
                alert("Twój telefon nie obsługuje GPS.");
            }
        }

        function aktualizujPozycjeGracza(pozycja) {
            const gLat = pozycja.coords.latitude;
            const gLng = pozycja.coords.longitude;

            if (markerGracza) {
                markerGracza.setLatLng([gLat, gLng]);
            } else {
                markerGracza = L.circleMarker([gLat, gLng], { color: 'blue', radius: 9 }).addTo(mapa).bindPopup("Twoja pozycja");
            }

            let najmniejszyDystans = Infinity;

            punktyTrasy.forEach(p => {
                if (!p.zdobyty) {
                    let dystans = obliczOdleglosc(gLat, gLng, p.lat, p.lng);
                    if (dystans < najmniejszyDystans) najmniejszyDystans = dystans;

                    // Tolerancja 15 metrów ze względu na gorszy zasięg GPS w górach/lasach
                    if (dystans <= 15) {
                        p.zdobyty = true;
                        zdobytePunkty++;
                        document.getElementById('stat-score').innerText = zdobytePunkty;
                        p.marker.setOpacity(0.3);
                        alert("Brawo! Zdobyliście punkt: " + p.nazwa);
                    }
                }
            });

            document.getElementById('stat-distance').innerText = najmniejszyDystans === Infinity ? "Wszystko zdobyte!" : Math.round(najmniejszyDystans);
        }

        function bladGPS(err) {
            console.warn("Błąd lokalizacji: " + err.message);
        }

        function obliczOdleglosc(lat1, lon1, lat2, lon2) {
            const R = 6371000; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
